name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check the GitHub Pages output
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          test -f dist/404.html || { echo "::error::dist/404.html is missing"; exit 1; }
          test -f dist/.nojekyll || { echo "::error::dist/.nojekyll is missing"; exit 1; }
          bad=$(grep -rhoE '(src|href)="/[^"]*"' dist --include='*.html' | grep -vE "=\"/${repo}/|=\"//" || true)
          if [ -n "$bad" ]; then
            echo "::error::Root-absolute URLs that ignore the /${repo}/ base path:"
            echo "$bad"
            exit 1
          fi

      - name: Upload build for review
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7
          include-hidden-files: true
